<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TROV APP{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', tahoma, Arial, sans-serif;
            background: #f5efe9;
            margin: 0;
            padding: 0;
            direction: rtl;
            font-size: 16px;
            color: #3e2a1e;
        }
        .container {
            max-width: 640px;
            margin: 12px auto;
            background: white;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(62, 42, 30, 0.12);
        }
        h1, h2, h3 { color: #3e2a1e; }
        a { color: #6f4e37; }
        input, select, textarea, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #d9c7b8;
            font-size: 16px;
            font-family: inherit;
        }
        button {
            background: #6f4e37;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #573b29; }
        .flash {
            background: #f3e5d8;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            color: #5a3d2b;
            border: 1px solid #e3cdb8;
        }
        .store-card {
            border: 1px solid #e7ddd3;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .whatsapp-btn {
            background: #fff;
            color: #6f4e37;
            border: 2px solid #6f4e37;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        td, th { padding: 8px; border-bottom: 1px solid #efe6dd; text-align: right; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .logout-link { color: #8a6a52; text-decoration: none; font-size: 14px; }
        .low-stock { color: #c0392b; font-weight: bold; }
        .store-card a {
            display: inline-block;
            padding: 10px 14px;
            background: #f5efe9;
            border-radius: 10px;
            text-decoration: none;
            color: #3e2a1e;
            font-size: 14px;
            margin-left: 6px;
        }
        .store-card a:hover { background: #eadfd3; }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center; font-size:26px; font-weight:bold; letter-spacing:6px; color:#3e2a1e; margin-bottom:14px;">TROV</div>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
